<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeCode — AI Practice Problems</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<style>
  :root{
    --bg: #1e1e2e;
    --surface: #282a3a;
    --editor-bg: #181825;
    --gutter-bg: #20212f;
    --text: #cdd6f4;
    --subtext: #9399b2;
    --accent: #89b4fa;
    --accent-hover: #74a8f7;
    --green: #a6e3a1;
    --green-hover: #8fd68a;
    --red: #f38ba8;
    --yellow: #f9e2af;
    --mauve: #cba6f7;
  }
  *{ box-sizing: border-box; }
  html, body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex;
    flex-direction:column;
  }
  button{ font-family:inherit; cursor:pointer; border:none; }
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  h1,h2{ margin:0; }

  /* ---------- boot overlay ---------- */
  #boot{
    position:fixed; inset:0;
    background: var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 1rem;
    z-index: 100;
    transition: opacity 0.4s ease;
  }
  #boot .spinner{
    width: 34px; height:34px;
    border-radius:50%;
    border: 3px solid var(--surface);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ #boot .spinner{ animation: none; } }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  #boot p{ color: var(--subtext); font-size:0.95rem; }
  #boot.hidden{ opacity:0; pointer-events:none; }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; flex-wrap:wrap;
    gap: 0.9rem;
    padding: 0.85rem 1.1rem;
    background: var(--bg);
    border-bottom: 1px solid rgba(205,214,244,0.08);
  }
  .brand{ display:flex; align-items:baseline; gap:0.5rem; margin-right: 0.6rem; }
  .brand h1{ font-size:1.25rem; }
  .brand .tagline{ color: var(--subtext); font-size:0.85rem; }
  .field{ display:flex; align-items:center; gap:0.4rem; font-size:0.88rem; color: var(--text); }
  select{
    background: var(--surface); color: var(--text);
    border: none; border-radius: 5px;
    padding: 0.4rem 0.5rem;
    font-size: 0.88rem;
  }
  .btn{
    background: var(--accent); color:#1e1e2e;
    font-weight:600; font-size:0.88rem;
    padding: 0.5rem 0.85rem; border-radius:6px;
  }
  .btn:hover{ background: var(--accent-hover); }
  .btn.run{ background: var(--green); }
  .btn.run:hover{ background: var(--green-hover); }
  .btn.ghost{ background: var(--surface); color: var(--text); font-weight:600; }
  .btn.ghost:hover{ background:#33364a; }
  .spacer{ flex:1; }
  #statusText{ color: var(--subtext); font-size:0.85rem; margin-right:0.5rem; }

  /* ---------- workspace ---------- */
  .workspace{
    flex:1;
    display:grid;
    grid-template-columns: minmax(280px, 2fr) minmax(340px, 3fr);
    gap: 12px;
    padding: 0 12px 12px;
    min-height:0;
  }
  @media (max-width: 860px){
    .workspace{ grid-template-columns: 1fr; }
  }

  .left-pane, .right-pane{
    display:flex; flex-direction:column;
    min-height:0;
  }
  @media (min-width: 861px){
    .left-pane, .right-pane{ height: calc(100vh - 76px); }
  }
  @media (max-width: 860px){
    .left-pane{ height: 60vh; }
    .right-pane{ height: 80vh; }
  }

  .tabs{ display:flex; gap:4px; padding: 4px 0; }
  .tab{
    background: var(--surface); color: var(--subtext);
    font-size:0.85rem; font-weight:600;
    padding: 0.55rem 0.9rem; border-radius: 6px 6px 0 0;
  }
  .tab.active{ background: var(--accent); color:#1e1e2e; }

  .tab-panel{
    background: var(--surface);
    border-radius: 0 6px 6px 6px;
    flex:1; min-height:0;
    display:flex; flex-direction:column;
    padding: 1rem 1.1rem;
    overflow:hidden;
  }
  .tab-panel.hidden{ display:none; }

  #problemTitle{ font-size:1.05rem; margin-bottom:0.2rem; }
  #problemMeta{ color: var(--subtext); font-size:0.85rem; margin: 0 0 0.7rem; }
  .problem-desc{
    flex:1; overflow-y:auto;
    white-space: pre-wrap;
    line-height:1.55; font-size:0.95rem;
    padding-right: 4px;
  }
  .problem-desc code{ color: var(--yellow); }
  .problem-actions{ display:flex; gap:0.6rem; padding-top:0.8rem; }

  .chat-log{
    flex:1; overflow-y:auto;
    font-size:0.9rem; line-height:1.55;
    padding-right:4px;
  }
  .chat-line{ margin-bottom:0.7rem; white-space:pre-wrap; }
  .chat-line .who-bot{ color: var(--accent); font-weight:700; }
  .chat-line .who-user{ color: var(--green); font-weight:700; }
  .chat-input-row{ display:flex; gap:0.5rem; padding-top:0.7rem; }
  .chat-input-row input{
    flex:1; background: var(--editor-bg); color: var(--text);
    border:none; border-radius:5px; padding:0.55rem 0.7rem; font-size:0.92rem;
  }

  .editor-wrap, .console-wrap{
    background: var(--surface);
    display:flex; flex-direction:column;
    border-radius:6px;
    min-height:0;
  }
  .editor-wrap{ flex: 3; margin-bottom:10px; }
  .console-wrap{ flex: 2; }
  .pane-label{
    color: var(--subtext); font-size:0.75rem; font-weight:700;
    letter-spacing:0.03em;
    padding: 0.6rem 0.8rem 0.3rem;
  }
  .editor-area{
    flex:1; display:flex; min-height:0;
    margin: 0 10px 10px;
    border-radius:4px; overflow:hidden;
  }
  #gutter{
    background: var(--gutter-bg); color: var(--subtext);
    font-family: Consolas, "Courier New", monospace;
    font-size: 0.92rem; line-height:1.5;
    padding: 8px 8px; text-align:right;
    user-select:none; overflow:hidden;
    white-space:pre;
  }
  #editor{
    flex:1; resize:none; border:none;
    background: var(--editor-bg); color:#f8f8f2;
    caret-color: var(--accent);
    font-family: Consolas, "Courier New", monospace;
    font-size:0.92rem; line-height:1.5;
    padding: 8px 10px;
  }
  .console{
    flex:1; margin: 0 10px 10px;
    background: #131320; border-radius:4px;
    color: var(--text);
    font-family: Consolas, "Courier New", monospace;
    font-size: 0.85rem; line-height:1.5;
    padding: 10px 12px;
    overflow:auto;
    white-space:pre-wrap;
  }
  .console .pass{ color: var(--green); }
  .console .fail{ color: var(--red); }
  .console .info{ color: var(--yellow); }
</style>
</head>
<body>

<div id="boot">
  <div class="spinner" aria-hidden="true"></div>
  <p id="bootMsg">Booting the Python engine…</p>
</div>

<header class="topbar">
  <div class="brand">
    <h1>🧠 FreeCode</h1>
    <span class="tagline">AI-generated practice problems</span>
  </div>

  <label class="field">Topic
    <select id="topicSelect"></select>
  </label>
  <label class="field">Difficulty
    <select id="diffSelect">
      <option>Easy</option>
      <option selected>Medium</option>
      <option>Hard</option>
    </select>
  </label>

  <button class="btn" id="newProblemBtn">🎲 New Problem</button>
  <button class="btn ghost" id="resetBtn">↺ Reset Code</button>

  <div class="spacer"></div>
  <span id="statusText">Ready</span>
  <button class="btn run" id="runBtn">▶ Run Code</button>
</header>

<main class="workspace">
  <section class="left-pane">
    <div class="tabs">
      <button class="tab active" data-tab="problem" id="tabProblemBtn">📋 Problem</button>
      <button class="tab" data-tab="chat" id="tabChatBtn">💬 Ask AI</button>
    </div>

    <div class="tab-panel" id="problemPanel">
      <h2 id="problemTitle">Loading…</h2>
      <p id="problemMeta"></p>
      <div class="problem-desc" id="problemDesc"></div>
      <div class="problem-actions">
        <button class="btn ghost" id="hintBtn">💡 Hint</button>
        <button class="btn ghost" id="solutionBtn">🔑 Solution</button>
      </div>
    </div>

    <div class="tab-panel hidden" id="chatPanel">
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input-row">
        <input id="chatInput" type="text" placeholder='Try "give me a hard dynamic programming problem"'>
        <button class="btn" id="chatSendBtn">Send</button>
      </div>
    </div>
  </section>

  <section class="right-pane">
    <div class="editor-wrap">
      <div class="pane-label">YOUR SOLUTION (PYTHON)</div>
      <div class="editor-area">
        <div id="gutter">1</div>
        <textarea id="editor" spellcheck="false"></textarea>
      </div>
    </div>
    <div class="console-wrap">
      <div class="pane-label">CONSOLE</div>
      <pre class="console" id="console"></pre>
    </div>
  </section>
</main>



<script>
let pyodide = null;

const els = {
  topicSelect: document.getElementById('topicSelect'),
  diffSelect: document.getElementById('diffSelect'),
  newProblemBtn: document.getElementById('newProblemBtn'),
  resetBtn: document.getElementById('resetBtn'),
  runBtn: document.getElementById('runBtn'),
  statusText: document.getElementById('statusText'),
  tabProblemBtn: document.getElementById('tabProblemBtn'),
  tabChatBtn: document.getElementById('tabChatBtn'),
  problemPanel: document.getElementById('problemPanel'),
  chatPanel: document.getElementById('chatPanel'),
  problemTitle: document.getElementById('problemTitle'),
  problemMeta: document.getElementById('problemMeta'),
  problemDesc: document.getElementById('problemDesc'),
  hintBtn: document.getElementById('hintBtn'),
  solutionBtn: document.getElementById('solutionBtn'),
  chatLog: document.getElementById('chatLog'),
  chatInput: document.getElementById('chatInput'),
  chatSendBtn: document.getElementById('chatSendBtn'),
  gutter: document.getElementById('gutter'),
  editor: document.getElementById('editor'),
  console: document.getElementById('console'),
  boot: document.getElementById('boot'),
  bootMsg: document.getElementById('bootMsg'),
};

const TOPICS = [
  "Random", "Arrays", "Strings", "Hash Table", "Linked List", "Trees",
  "Recursion", "Dynamic Programming", "Sorting & Searching", "Math",
  "Stack & Queue"
];

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function populateTopics(){
  els.topicSelect.innerHTML = TOPICS.map(t => `<option>${t}</option>`).join('');
  els.topicSelect.value = "Random";
}

/* ---------------- tabs ---------------- */
function selectTab(name){
  const isProblem = name === 'problem';
  els.tabProblemBtn.classList.toggle('active', isProblem);
  els.tabChatBtn.classList.toggle('active', !isProblem);
  els.problemPanel.classList.toggle('hidden', !isProblem);
  els.chatPanel.classList.toggle('hidden', isProblem);
}
els.tabProblemBtn.addEventListener('click', () => selectTab('problem'));
els.tabChatBtn.addEventListener('click', () => selectTab('chat'));

/* ---------------- editor gutter ---------------- */
function refreshGutter(){
  const lines = els.editor.value.split('\n').length;
  let out = '';
  for (let i = 1; i <= lines; i++) out += i + '\n';
  els.gutter.textContent = out;
}
els.editor.addEventListener('input', refreshGutter);
els.editor.addEventListener('scroll', () => {
  els.gutter.scrollTop = els.editor.scrollTop;
});
els.editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab'){
    e.preventDefault();
    const start = els.editor.selectionStart;
    const end = els.editor.selectionEnd;
    els.editor.value = els.editor.value.slice(0, start) + '    ' + els.editor.value.slice(end);
    els.editor.selectionStart = els.editor.selectionEnd = start + 4;
    refreshGutter();
  }
});

/* ---------------- chat log ---------------- */
function chatBot(text){
  const line = document.createElement('div');
  line.className = 'chat-line';
  line.innerHTML = `<span class="who-bot">FreeCode AI: </span>${escapeHtml(text)}`;
  els.chatLog.appendChild(line);
  els.chatLog.scrollTop = els.chatLog.scrollHeight;
}
function chatUser(text){
  const line = document.createElement('div');
  line.className = 'chat-line';
  line.innerHTML = `<span class="who-user">You: </span>${escapeHtml(text)}`;
  els.chatLog.appendChild(line);
  els.chatLog.scrollTop = els.chatLog.scrollHeight;
}

/* ---------------- problem loading ---------------- */
function loadProblemDisplay(data){
  els.problemTitle.textContent = data.title;
  els.problemMeta.textContent = `${data.topic}   •   ${data.difficulty}`;
  els.problemDesc.textContent = data.description;
  els.editor.value = data.starter_code;
  refreshGutter();
  els.console.textContent = '';
  els.statusText.textContent = 'Ready';
}

function newProblem(){
  const topic = els.topicSelect.value;
  const difficulty = els.diffSelect.value;
  const raw = pyodide.globals.get('js_new_problem')(topic, difficulty);
  const data = JSON.parse(raw);
  loadProblemDisplay(data);
  chatBot(`Loaded a new ${data.difficulty} ${data.topic} problem: **${data.title}**. Good luck!`);
  selectTab('problem');
}
els.newProblemBtn.addEventListener('click', newProblem);

els.resetBtn.addEventListener('click', () => {
  const starter = pyodide.globals.get('js_reset_code')();
  if (starter){
    els.editor.value = starter;
    refreshGutter();
  }
});

/* ---------------- running code ---------------- */
function runCode(){
  const source = els.editor.value;
  const raw = pyodide.globals.get('js_run_code')(source);
  const data = JSON.parse(raw);

  const lines = [];
  if (data.stdout && data.stdout.trim()){
    lines.push({ text: 'Output:\n' + data.stdout, cls: 'info' });
  }

  if (data.error){
    lines.push({ text: 'Error:\n' + data.error, cls: 'fail' });
    els.statusText.textContent = '❌ Error';
  } else {
    const results = data.results;
    let passed = 0;
    results.forEach((r, i) => {
      if (r.passed) passed++;
      const mark = r.passed ? '✓' : '✗';
      const cls = r.passed ? 'pass' : 'fail';
      let entry = `${mark} Test ${i + 1}   input=${r.input}\n`;
      if (r.error){
        entry += `    Error: ${r.error}\n`;
      } else {
        entry += `    expected=${r.expected}   got=${r.actual}\n`;
      }
      lines.push({ text: entry, cls });
    });
    const total = results.length;
    const summaryCls = passed === total ? 'pass' : 'fail';
    lines.push({ text: `\n${passed}/${total} tests passed\n`, cls: summaryCls });
    els.statusText.textContent = passed === total ? `✅ ${passed}/${total} passed` : `⚠️ ${passed}/${total} passed`;
  }

  els.console.innerHTML = '';
  lines.forEach(l => {
    const span = document.createElement('span');
    span.className = l.cls;
    span.textContent = l.text;
    els.console.appendChild(span);
  });
}
els.runBtn.addEventListener('click', runCode);

/* ---------------- hint / solution ---------------- */
els.hintBtn.addEventListener('click', () => {
  const hint = pyodide.globals.get('js_get_hint')();
  chatBot('Hint: ' + hint);
  selectTab('chat');
});

els.solutionBtn.addEventListener('click', () => {
  const ok = window.confirm("Are you sure? Trying it yourself first is the best way to learn.");
  if (!ok) return;
  const sol = pyodide.globals.get('js_get_solution')();
  chatBot("Here's a reference solution:\n\n" + sol);
  selectTab('chat');
});

/* ---------------- chat handling ---------------- */
function handleChat(text){
  const lowered = text.toLowerCase();
  if (lowered.includes('hint')){
    const hint = pyodide.globals.get('js_get_hint')();
    chatBot('Hint: ' + hint);
    return;
  }
  if (lowered.includes('solution') || lowered.includes('answer')){
    const sol = pyodide.globals.get('js_get_solution')();
    chatBot("Here's a reference solution:\n\n" + sol);
    return;
  }

  const parsed = JSON.parse(pyodide.globals.get('js_parse_chat')(text));
  let topic = parsed.topic;
  const difficulty = parsed.difficulty;

  if (!topic){
    const triggerWords = ['problem', 'give me', 'another', 'next', 'challenge', 'practice', 'question', 'quiz'];
    if (triggerWords.some(w => lowered.includes(w))){
      const realTopics = TOPICS.slice(1);
      topic = realTopics[Math.floor(Math.random() * realTopics.length)];
    } else {
      chatBot('I can generate a problem for you! Try naming a topic ' +
        '(arrays, strings, hash table, linked list, trees, recursion, ' +
        'dynamic programming, sorting, searching, math, stack, queue) ' +
        'and optionally a difficulty (easy / medium / hard).');
      return;
    }
  }

  const raw = pyodide.globals.get('js_new_problem')(topic, difficulty);
  const data = JSON.parse(raw);
  loadProblemDisplay(data);
  els.topicSelect.value = data.topic;
  els.diffSelect.value = data.difficulty;
  chatBot(`Here's a ${data.difficulty} ${data.topic} problem: **${data.title}**. ` +
    `I've loaded it into the Problem tab with fresh starter code.`);
  selectTab('problem');
}

function sendChat(){
  const text = els.chatInput.value.trim();
  if (!text) return;
  els.chatInput.value = '';
  chatUser(text);
  handleChat(text);
}
els.chatSendBtn.addEventListener('click', sendChat);
els.chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChat();
});

/* ---------------- boot ---------------- */
async function boot(){
  populateTopics();
  pyodide = await loadPyodide();
  els.bootMsg.textContent = 'Loading freecode.py…';
  let engineSrc;
  try {
    const resp = await fetch('freecode.py');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    engineSrc = await resp.text();
  } catch (err) {
    els.bootMsg.textContent = 'Could not load freecode.py — make sure it sits next to index.html on a served site (this won\'t work opened directly as a local file).';
    return;
  }
  els.bootMsg.textContent = 'Starting the practice engine…';
  pyodide.runPython(engineSrc);

  newProblem();
  chatBot("Hi! I'm your FreeCode assistant. Ask me for a problem — try " +
    '"give me a hard dynamic programming problem" or just "array problem". ' +
    'Once a problem is loaded you can also ask me for a "hint" or the "solution".');

  els.boot.classList.add('hidden');
  setTimeout(() => els.boot.remove(), 450);
}
boot();
</script>

</body>
</html>
